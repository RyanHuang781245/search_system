<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <title>會議記錄 PDF 欄位標註示意圖</title>
  <desc>以去識別化示意文件標註會議主檔欄位與會議項目表格欄位。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <style>
      .title{font:700 25px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .doc-title{font:700 18px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .text{font:500 14px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .tiny{font:500 12px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .label{font:700 15px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .small{font:500 13px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#333}
      .page{fill:#fff;stroke:#111;stroke-width:1.8}
      .cell{fill:#fff;stroke:#111;stroke-width:1.1}
      .header{fill:#f3f3f3;stroke:#111;stroke-width:1.1}
      .mark{fill:none;stroke:#111;stroke-width:2.4}
      .mark2{fill:none;stroke:#555;stroke-width:2;stroke-dasharray:7 5}
      .callout{fill:#fbfbfb;stroke:#111;stroke-width:1.5}
      .arrow{fill:none;stroke:#111;stroke-width:1.6;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#555;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="820" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="title">會議記錄 PDF 欄位標註示意圖</text>

  <!-- PDF page -->
  <rect x="310" y="75" width="540" height="680" class="page"/>
  <text x="580" y="112" text-anchor="middle" class="doc-title">企業會議記錄表</text>
  <text x="580" y="138" text-anchor="middle" class="small">去識別化示意文件</text>

  <!-- metadata block -->
  <rect x="345" y="165" width="470" height="150" class="cell"/>
  <line x1="345" y1="202" x2="815" y2="202" class="cell"/>
  <line x1="345" y1="239" x2="815" y2="239" class="cell"/>
  <line x1="345" y1="276" x2="815" y2="276" class="cell"/>
  <line x1="490" y1="165" x2="490" y2="315" class="cell"/>
  <line x1="635" y1="165" x2="635" y2="315" class="cell"/>
  <text x="365" y="190" class="text">會議名稱</text>
  <text x="505" y="190" class="text">年度品質追蹤會議</text>
  <text x="655" y="190" class="text">會議日期</text>
  <text x="745" y="190" class="text">2026-05-20</text>
  <text x="365" y="227" class="text">地點</text>
  <text x="505" y="227" class="text">會議室 A</text>
  <text x="655" y="227" class="text">主席</text>
  <text x="745" y="227" class="text">Person_01</text>
  <text x="365" y="264" class="text">記錄人</text>
  <text x="505" y="264" class="text">Person_02</text>
  <text x="655" y="264" class="text">權責單位</text>
  <text x="745" y="264" class="text">Unit_01</text>
  <text x="365" y="301" class="text">出席人員</text>
  <text x="505" y="301" class="text">Person_03、Person_04、Person_05</text>

  <!-- item table -->
  <rect x="345" y="350" width="470" height="265" class="cell"/>
  <rect x="345" y="350" width="470" height="38" class="header"/>
  <line x1="390" y1="350" x2="390" y2="615" class="cell"/>
  <line x1="585" y1="350" x2="585" y2="615" class="cell"/>
  <line x1="650" y1="350" x2="650" y2="615" class="cell"/>
  <line x1="720" y1="350" x2="720" y2="615" class="cell"/>
  <line x1="345" y1="438" x2="815" y2="438" class="cell"/>
  <line x1="345" y1="526" x2="815" y2="526" class="cell"/>
  <text x="367" y="374" text-anchor="middle" class="tiny">項次</text>
  <text x="488" y="374" text-anchor="middle" class="tiny">會議內容</text>
  <text x="617" y="374" text-anchor="middle" class="tiny">負責人</text>
  <text x="685" y="374" text-anchor="middle" class="tiny">預計日期</text>
  <text x="767" y="374" text-anchor="middle" class="tiny">追蹤結果</text>
  <text x="367" y="410" text-anchor="middle" class="tiny">01</text>
  <text x="405" y="410" class="tiny">確認產品文件補件狀態</text>
  <text x="617" y="410" text-anchor="middle" class="tiny">Person_06</text>
  <text x="685" y="410" text-anchor="middle" class="tiny">2026-06-10</text>
  <text x="735" y="410" class="tiny">持續追蹤</text>
  <text x="367" y="498" text-anchor="middle" class="tiny">02</text>
  <text x="405" y="498" class="tiny">彙整客訴分析與改善方案</text>
  <text x="617" y="498" text-anchor="middle" class="tiny">Person_07</text>
  <text x="685" y="498" text-anchor="middle" class="tiny">2026-06-15</text>
  <text x="735" y="498" class="tiny">待確認</text>
  <text x="367" y="586" text-anchor="middle" class="tiny">03</text>
  <text x="405" y="586" class="tiny">追蹤法規文件更新</text>
  <text x="617" y="586" text-anchor="middle" class="tiny">Person_08</text>
  <text x="685" y="586" text-anchor="middle" class="tiny">2026-06-30</text>
  <text x="735" y="586" class="tiny">未完成</text>

  <!-- annotation rectangles -->
  <rect x="345" y="165" width="470" height="150" class="mark"/>
  <rect x="345" y="350" width="470" height="265" class="mark2"/>
  <rect x="390" y="388" width="195" height="227" class="mark"/>
  <rect x="585" y="388" width="65" height="227" class="mark"/>
  <rect x="650" y="388" width="70" height="227" class="mark"/>
  <rect x="720" y="388" width="95" height="227" class="mark"/>

  <!-- callouts -->
  <rect x="70" y="150" width="205" height="72" rx="8" class="callout"/>
  <text x="172" y="178" text-anchor="middle" class="label">會議主檔欄位</text>
  <text x="172" y="204" text-anchor="middle" class="small">提供會議層級脈絡</text>
  <path d="M275 186 H335" class="arrow"/>

  <rect x="70" y="385" width="205" height="80" rx="8" class="callout"/>
  <text x="172" y="414" text-anchor="middle" class="label">會議內容欄位</text>
  <text x="172" y="440" text-anchor="middle" class="small">作為問答與語意檢索</text>
  <text x="172" y="460" text-anchor="middle" class="small">的主要文字來源</text>
  <path d="M275 425 H382" class="arrow"/>

  <rect x="925" y="375" width="205" height="70" rx="8" class="callout"/>
  <text x="1028" y="403" text-anchor="middle" class="label">負責人欄位</text>
  <text x="1028" y="429" text-anchor="middle" class="small">支援責任歸屬查詢</text>
  <path d="M925 410 H660" class="arrow"/>

  <rect x="925" y="475" width="205" height="70" rx="8" class="callout"/>
  <text x="1028" y="503" text-anchor="middle" class="label">日期欄位</text>
  <text x="1028" y="529" text-anchor="middle" class="small">支援時程與狀態判斷</text>
  <path d="M925 510 H728" class="arrow"/>

  <rect x="925" y="575" width="205" height="70" rx="8" class="callout"/>
  <text x="1028" y="603" text-anchor="middle" class="label">追蹤結果欄位</text>
  <text x="1028" y="629" text-anchor="middle" class="small">支援完成情形回答</text>
  <path d="M925 610 H825" class="arrow"/>

  <rect x="350" y="655" width="460" height="48" rx="8" class="callout"/>
  <text x="580" y="685" text-anchor="middle" class="small">註：本圖為去識別化示意版面，用於說明欄位抽取位置與後續問答用途。</text>

  <text x="600" y="775" text-anchor="middle" class="small">資料來源：本研究整理</text>
</svg>
