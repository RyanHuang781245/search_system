<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>圖 4.1 會議記錄領域知識圖譜 Schema 圖</title>
  <desc>呈現會議記錄領域知識圖譜中的核心節點與關係。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <style>
      .title{font:700 25px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .node{font:700 17px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .edge{font:500 16px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#333}
      .small{font:500 14px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#333}
      .core{fill:#fff;stroke:#111;stroke-width:2}
      .soft{fill:#f7f7f7;stroke:#111;stroke-width:1.6}
      .doc-text{fill:#1d4ed8}
      .meeting-text{fill:#15803d}
      .item-text{fill:#b45309}
      .person-text{fill:#6d28d9}
      .unit-text{fill:#0f766e}
      .date-text{fill:#c2410c}
      .product-text{fill:#0369a1}
      .regulation-text{fill:#be123c}
      .keyword-text{fill:#9333ea}
      .line{fill:none;stroke:#111;stroke-width:1.7;marker-end:url(#arrow)}
      .weak{fill:none;stroke:#555;stroke-width:1.3;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="title">會議記錄領域知識圖譜 Schema 圖</text>

  <ellipse cx="160" cy="340" rx="78" ry="40" class="core"/>
  <text x="160" y="347" text-anchor="middle" class="node doc-text">Document</text>
  <ellipse cx="390" cy="340" rx="72" ry="40" class="core"/>
  <text x="390" y="347" text-anchor="middle" class="node meeting-text">Meeting</text>
  <ellipse cx="630" cy="340" rx="92" ry="44" class="core"/>
  <text x="630" y="347" text-anchor="middle" class="node item-text">MeetingItem</text>

  <ellipse cx="620" cy="135" rx="70" ry="38" class="soft"/>
  <text x="620" y="142" text-anchor="middle" class="node person-text">Person</text>
  <ellipse cx="805" cy="150" rx="60" ry="36" class="soft"/>
  <text x="805" y="157" text-anchor="middle" class="node unit-text">Unit</text>
  <ellipse cx="890" cy="340" rx="60" ry="36" class="soft"/>
  <text x="890" y="347" text-anchor="middle" class="node date-text">Date</text>
  <ellipse cx="760" cy="545" rx="70" ry="38" class="soft"/>
  <text x="760" y="552" text-anchor="middle" class="node product-text">Product</text>
  <ellipse cx="970" cy="545" rx="78" ry="38" class="soft"/>
  <text x="970" y="552" text-anchor="middle" class="node regulation-text">Regulation</text>
  <ellipse cx="1030" cy="245" rx="70" ry="38" class="soft"/>
  <text x="1030" y="252" text-anchor="middle" class="node keyword-text">Keyword</text>

  <path d="M238 340 H318" class="line"/>
  <text x="278" y="315" text-anchor="middle" class="edge">HAS_MEETING</text>
  <path d="M462 340 H538" class="line"/>
  <text x="500" y="315" text-anchor="middle" class="edge">HAS_ITEM</text>

  <path d="M620 173 C615 225 615 275 625 296" class="line"/>
  <text x="545" y="230" text-anchor="middle" class="edge">RESPONSIBLE_BY</text>
  <path d="M552 142 C510 150 420 220 398 300" class="weak"/>
  <text x="370" y="178" text-anchor="middle" class="edge">CHAIRED_BY / ATTENDED_BY</text>
  <path d="M760 176 C690 205 650 265 640 296" class="line"/>
  <text x="770" y="232" text-anchor="middle" class="edge">BELONGS_TO_UNIT</text>
  <path d="M830 340 H724" class="line"/>
  <text x="785" y="360" text-anchor="middle" class="edge">HAS_DATE</text>
  <path d="M728 510 C700 480 670 420 650 383" class="weak"/>
  <text x="600" y="472" text-anchor="middle" class="edge">MENTIONS_PRODUCT</text>
  <path d="M930 512 C850 480 730 410 675 379" class="weak"/>
  <text x="910" y="450" text-anchor="middle" class="edge">MENTIONS_REGULATION</text>
  <path d="M963 256 C875 285 760 318 719 330" class="weak"/>
  <text x="850" y="276" text-anchor="middle" class="edge">MENTIONS</text>
  <path d="M960 238 C910 205 860 190 833 180" class="weak"/>
  <text x="945" y="190" text-anchor="middle" class="edge">CO_OCCURS_WITH</text>
</svg>
