<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>圖 3.4 混合式證據檢索架構圖</title>
  <desc>呈現使用者問題依查詢意圖啟動結構化欄位、知識關聯與語意相似三種證據檢索來源。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <style>
      .title{font:700 25px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .label{font:700 18px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .text{font:600 16px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .small{font:500 14px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#333}
      .box{fill:#fff;stroke:#111;stroke-width:1.8}
      .soft{fill:#f7f7f7;stroke:#111;stroke-width:1.5}
      .arrow{fill:none;stroke:#111;stroke-width:1.9;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#555;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="title">混合式證據檢索架構圖</text>

  <rect x="75" y="285" width="190" height="78" rx="10" class="box"/>
  <text x="170" y="314" text-anchor="middle" class="label">使用者問題</text>
  <text x="170" y="342" text-anchor="middle" class="text">查詢條件或自然語言</text>

  <rect x="330" y="285" width="190" height="78" rx="10" class="box"/>
  <text x="425" y="314" text-anchor="middle" class="label">查詢意圖判斷</text>
  <text x="425" y="342" text-anchor="middle" class="text">欄位、關係、語意</text>

  <rect x="625" y="120" width="250" height="88" rx="10" class="box"/>
  <text x="750" y="150" text-anchor="middle" class="label">結構化欄位檢索</text>
  <text x="750" y="178" text-anchor="middle" class="text">負責人、日期、狀態</text>
  <text x="750" y="202" text-anchor="middle" class="text">與欄位命中位置</text>

  <rect x="625" y="285" width="250" height="88" rx="10" class="box"/>
  <text x="750" y="315" text-anchor="middle" class="label">知識關聯檢索</text>
  <text x="750" y="343" text-anchor="middle" class="text">人員、產品、法規</text>
  <text x="750" y="367" text-anchor="middle" class="text">與圖譜路徑</text>

  <rect x="625" y="450" width="250" height="88" rx="10" class="box"/>
  <text x="750" y="480" text-anchor="middle" class="label">語意相似檢索</text>
  <text x="750" y="508" text-anchor="middle" class="text">召回用詞不同但</text>
  <text x="750" y="532" text-anchor="middle" class="text">語意相近的項目</text>

  <rect x="980" y="285" width="170" height="88" rx="10" class="box"/>
  <text x="1065" y="315" text-anchor="middle" class="label">候選證據</text>
  <text x="1065" y="343" text-anchor="middle" class="text">以 item_id</text>
  <text x="1065" y="367" text-anchor="middle" class="text">合併結果</text>

  <rect x="415" y="590" width="370" height="62" rx="10" class="soft"/>
  <text x="600" y="615" text-anchor="middle" class="label">設計原則</text>
  <text x="600" y="642" text-anchor="middle" class="text">不同檢索來源互補，召回結果不直接等同最終答案</text>

  <path d="M265 324 H320" class="arrow"/>
  <path d="M520 324 C565 270 575 180 615 164" class="arrow"/>
  <path d="M520 324 H615" class="arrow"/>
  <path d="M520 324 C565 378 575 478 615 494" class="arrow"/>
  <path d="M875 164 C925 185 940 290 970 316" class="dash"/>
  <path d="M875 329 H970" class="arrow"/>
  <path d="M875 494 C925 470 940 370 970 342" class="dash"/>
  <path d="M1065 373 C1065 450 750 550 750 580" class="dash"/>

  <text x="600" y="675" text-anchor="middle" class="small">資料來源：本研究整理</text>
</svg>
