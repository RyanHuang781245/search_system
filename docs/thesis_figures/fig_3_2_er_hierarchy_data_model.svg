<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <title>資料模型 ER 與層級示意圖</title>
  <desc>呈現企業會議記錄系統中的 Document、Meeting、MeetingItem 三層資料模型與主要欄位。</desc>
  <defs>
    <style>
      .title{font:700 25px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .entity-title{font:700 20px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .field{font:500 15px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .label{font:600 15px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#333}
      .small{font:500 14px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#333}
      .entity{fill:#fff;stroke:#111;stroke-width:1.8}
      .header{fill:#f4f4f4;stroke:#111;stroke-width:1.8}
      .key{font:700 15px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .line{fill:none;stroke:#111;stroke-width:1.8}
      .dash{fill:none;stroke:#555;stroke-width:1.3;stroke-dasharray:7 5}
      .note{fill:#fbfbfb;stroke:#111;stroke-width:1.4}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#fff"/>
  <text x="600" y="44" text-anchor="middle" class="title">資料模型 ER 與層級示意圖</text>

  <!-- Document entity -->
  <rect x="70" y="115" width="300" height="300" rx="8" class="entity"/>
  <rect x="70" y="115" width="300" height="48" rx="8" class="header"/>
  <text x="220" y="146" text-anchor="middle" class="entity-title">Document</text>
  <text x="96" y="196" class="key">PK  document_id</text>
  <text x="96" y="228" class="field">original_filename</text>
  <text x="96" y="258" class="field">doc_type</text>
  <text x="96" y="288" class="field">file_path</text>
  <text x="96" y="318" class="field">upload_status</text>
  <text x="96" y="348" class="field">created_at</text>
  <text x="96" y="378" class="field">page_count</text>

  <!-- Meeting entity -->
  <rect x="450" y="95" width="300" height="340" rx="8" class="entity"/>
  <rect x="450" y="95" width="300" height="48" rx="8" class="header"/>
  <text x="600" y="126" text-anchor="middle" class="entity-title">Meeting</text>
  <text x="476" y="176" class="key">PK  meeting_id</text>
  <text x="476" y="206" class="key">FK  document_id</text>
  <text x="476" y="238" class="field">meeting_name</text>
  <text x="476" y="268" class="field">meeting_date</text>
  <text x="476" y="298" class="field">location</text>
  <text x="476" y="328" class="field">chairperson</text>
  <text x="476" y="358" class="field">recorder</text>
  <text x="476" y="388" class="field">responsible_unit</text>
  <text x="476" y="418" class="field">attendees</text>

  <!-- MeetingItem entity -->
  <rect x="830" y="75" width="300" height="390" rx="8" class="entity"/>
  <rect x="830" y="75" width="300" height="48" rx="8" class="header"/>
  <text x="980" y="106" text-anchor="middle" class="entity-title">MeetingItem</text>
  <text x="856" y="156" class="key">PK  item_id</text>
  <text x="856" y="186" class="key">FK  meeting_id</text>
  <text x="856" y="216" class="key">FK  document_id</text>
  <text x="856" y="248" class="field">item_no</text>
  <text x="856" y="278" class="field">content</text>
  <text x="856" y="308" class="field">owner</text>
  <text x="856" y="338" class="field">planned_date</text>
  <text x="856" y="368" class="field">actual_completed_date</text>
  <text x="856" y="398" class="field">tracking_result</text>
  <text x="856" y="428" class="field">status</text>

  <!-- Relationships -->
  <line x1="370" y1="265" x2="450" y2="265" class="line"/>
  <line x1="750" y1="265" x2="830" y2="265" class="line"/>
  <text x="410" y="246" text-anchor="middle" class="label">1 對 1..n</text>
  <text x="790" y="246" text-anchor="middle" class="label">1 對 1..n</text>
  <text x="410" y="290" text-anchor="middle" class="small">包含會議</text>
  <text x="790" y="290" text-anchor="middle" class="small">包含項目</text>

  <!-- Evidence unit note -->
  <rect x="300" y="550" width="600" height="92" rx="10" class="note"/>
  <text x="600" y="582" text-anchor="middle" class="entity-title">最小證據單位：MeetingItem</text>
  <text x="600" y="615" text-anchor="middle" class="field">每一筆 MeetingItem 對應一列會議項目，保存任務內容、負責人、日期與追蹤結果。</text>
  <text x="600" y="640" text-anchor="middle" class="field">回答可由 item_id 回溯至 meeting_id 與 document_id。</text>

  <path d="M980 465 C980 520 600 510 600 540" class="dash"/>
  <path d="M600 435 C600 500 600 510 600 540" class="dash"/>
  <path d="M220 415 C220 520 600 510 600 540" class="dash"/>

  <text x="600" y="710" text-anchor="middle" class="small">資料來源：本研究整理</text>
</svg>
