<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>圖 4.2 GraphRAG 檢索回應流程圖</title>
  <desc>呈現使用者問題經查詢路由、候選證據取得、證據合併、上下文組裝與來源限制回答生成的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <style>
      .title{font:700 25px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .label{font:700 18px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .text{font:600 16px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .small{font:500 14px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#333}
      .box{fill:#fff;stroke:#111;stroke-width:1.8}
      .soft{fill:#f7f7f7;stroke:#111;stroke-width:1.5}
      .decision{fill:#fff;stroke:#111;stroke-width:1.8}
      .arrow{fill:none;stroke:#111;stroke-width:1.9;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#555;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="title">GraphRAG 檢索回應流程圖</text>

  <rect x="70" y="130" width="185" height="72" rx="10" class="box"/>
  <text x="162" y="158" text-anchor="middle" class="label">問題輸入</text>
  <text x="162" y="184" text-anchor="middle" class="text">自然語言查詢</text>

  <rect x="320" y="130" width="185" height="72" rx="10" class="box"/>
  <text x="412" y="158" text-anchor="middle" class="label">查詢路由</text>
  <text x="412" y="184" text-anchor="middle" class="text">判斷問題類型</text>

  <rect x="570" y="95" width="205" height="72" rx="10" class="soft"/>
  <text x="672" y="123" text-anchor="middle" class="label">欄位事實</text>
  <text x="672" y="149" text-anchor="middle" class="text">精確條件與欄位命中</text>

  <rect x="570" y="205" width="205" height="72" rx="10" class="soft"/>
  <text x="672" y="233" text-anchor="middle" class="label">關係脈絡</text>
  <text x="672" y="259" text-anchor="middle" class="text">圖譜節點與路徑</text>

  <rect x="570" y="315" width="205" height="72" rx="10" class="soft"/>
  <text x="672" y="343" text-anchor="middle" class="label">語意相似</text>
  <text x="672" y="369" text-anchor="middle" class="text">相近 MeetingItem</text>

  <rect x="845" y="205" width="205" height="72" rx="10" class="box"/>
  <text x="948" y="233" text-anchor="middle" class="label">證據合併</text>
  <text x="948" y="259" text-anchor="middle" class="text">依 item_id 去重</text>

  <rect x="845" y="335" width="205" height="72" rx="10" class="box"/>
  <text x="948" y="363" text-anchor="middle" class="label">上下文組裝</text>
  <text x="948" y="389" text-anchor="middle" class="text">欄位、路徑、來源</text>

  <rect x="575" y="500" width="220" height="82" rx="10" class="box"/>
  <text x="685" y="528" text-anchor="middle" class="label">來源限制回答生成</text>
  <text x="685" y="556" text-anchor="middle" class="text">只根據證據作答</text>
  <text x="685" y="580" text-anchor="middle" class="text">避免無來源推論</text>

  <polygon points="948,490 1058,545 948,600 838,545" class="decision"/>
  <text x="948" y="540" text-anchor="middle" class="label">證據是否</text>
  <text x="948" y="564" text-anchor="middle" class="label">足以回答？</text>

  <rect x="865" y="635" width="210" height="52" rx="10" class="box"/>
  <text x="970" y="668" text-anchor="middle" class="label">回答與來源回溯</text>

  <rect x="335" y="635" width="210" height="52" rx="10" class="soft"/>
  <text x="440" y="668" text-anchor="middle" class="label">資料不足明確拒答</text>

  <path d="M255 166 H310" class="arrow"/>
  <path d="M505 166 C530 145 545 135 560 131" class="arrow"/>
  <path d="M505 166 C535 200 545 225 560 241" class="arrow"/>
  <path d="M505 166 C535 250 545 330 560 351" class="arrow"/>
  <path d="M775 131 C815 150 828 205 835 231" class="dash"/>
  <path d="M775 241 H835" class="arrow"/>
  <path d="M775 351 C815 330 828 285 835 251" class="dash"/>
  <path d="M948 277 V325" class="arrow"/>
  <path d="M948 407 V480" class="arrow"/>
  <path d="M838 545 H805" class="arrow"/>
  <path d="M1058 545 C1090 585 1060 630 1032 635" class="arrow"/>
  <path d="M685 582 C685 625 545 625 512 635" class="dash"/>
  <text x="1095" y="580" text-anchor="middle" class="small">是</text>
  <text x="820" y="525" text-anchor="middle" class="small">否</text>

  <text x="600" y="705" text-anchor="middle" class="small">資料來源：本研究整理</text>
</svg>
