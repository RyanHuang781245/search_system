<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>圖 3.3 會議記錄結構化解析流程圖</title>
  <desc>呈現固定格式會議記錄 PDF 轉換為會議主檔與會議項目資料的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <style>
      .title{font:700 25px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .label{font:700 18px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .text{font:600 16px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .small{font:500 14px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#333}
      .box{fill:#fff;stroke:#111;stroke-width:1.8}
      .soft{fill:#f7f7f7;stroke:#111;stroke-width:1.5}
      .decision{fill:#fff;stroke:#111;stroke-width:1.8}
      .arrow{fill:none;stroke:#111;stroke-width:1.9;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="title">會議記錄結構化解析流程圖</text>

  <rect x="70" y="145" width="190" height="78" rx="10" class="box"/>
  <text x="165" y="174" text-anchor="middle" class="label">輸入文件</text>
  <text x="165" y="203" text-anchor="middle" class="text">會議記錄 PDF</text>

  <rect x="330" y="145" width="205" height="78" rx="10" class="box"/>
  <text x="432" y="174" text-anchor="middle" class="label">文字與表格擷取</text>
  <text x="432" y="203" text-anchor="middle" class="text">取得頁面內容</text>

  <polygon points="650,125 760,184 650,243 540,184" class="decision"/>
  <text x="650" y="178" text-anchor="middle" class="label">文字層是否</text>
  <text x="650" y="202" text-anchor="middle" class="label">足以解析？</text>

  <rect x="840" y="105" width="250" height="88" rx="10" class="box"/>
  <text x="965" y="134" text-anchor="middle" class="label">擷取會議主檔</text>
  <text x="965" y="162" text-anchor="middle" class="text">名稱、日期、地點</text>
  <text x="965" y="186" text-anchor="middle" class="text">主席、記錄人、出席人員</text>

  <rect x="840" y="250" width="250" height="88" rx="10" class="box"/>
  <text x="965" y="279" text-anchor="middle" class="label">解析會議項目表格</text>
  <text x="965" y="307" text-anchor="middle" class="text">項次、內容、負責人</text>
  <text x="965" y="331" text-anchor="middle" class="text">日期與追蹤結果</text>

  <rect x="505" y="405" width="250" height="88" rx="10" class="box"/>
  <text x="630" y="434" text-anchor="middle" class="label">欄位清理與標準化</text>
  <text x="630" y="462" text-anchor="middle" class="text">空值、日期、狀態</text>
  <text x="630" y="486" text-anchor="middle" class="text">與來源識別碼</text>

  <rect x="835" y="405" width="250" height="88" rx="10" class="box"/>
  <text x="960" y="434" text-anchor="middle" class="label">建立結構化輸出</text>
  <text x="960" y="462" text-anchor="middle" class="text">Meeting</text>
  <text x="960" y="486" text-anchor="middle" class="text">MeetingItem</text>

  <rect x="280" y="405" width="150" height="70" rx="10" class="soft"/>
  <text x="355" y="434" text-anchor="middle" class="label">標記</text>
  <text x="355" y="462" text-anchor="middle" class="text">需人工處理</text>

  <rect x="410" y="570" width="380" height="68" rx="10" class="soft"/>
  <text x="600" y="598" text-anchor="middle" class="label">解析目的</text>
  <text x="600" y="625" text-anchor="middle" class="text">保留欄位對應，使後續檢索與問答可回溯來源</text>

  <path d="M260 184 H320" class="arrow"/>
  <path d="M535 184 H538" class="arrow"/>
  <path d="M760 184 H830" class="arrow"/>
  <path d="M965 193 V240" class="arrow"/>
  <path d="M965 338 V395" class="arrow"/>
  <path d="M840 449 H765" class="arrow"/>
  <path d="M540 184 C455 250 355 310 355 395" class="arrow"/>
  <path d="M630 493 V560" class="arrow"/>
  <text x="795" y="165" text-anchor="middle" class="small">是</text>
  <text x="475" y="254" text-anchor="middle" class="small">否</text>

  <text x="600" y="675" text-anchor="middle" class="small">資料來源：本研究整理</text>
</svg>
