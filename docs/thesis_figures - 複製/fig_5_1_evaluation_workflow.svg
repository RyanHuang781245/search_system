<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>圖 5.1 GraphRAG 檢索回應評估流程圖</title>
  <desc>呈現 GraphRAG 問答結果如何透過來源欄位、圖譜關係與原始文件進行人工對照與分類。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <style>
      .title{font:700 25px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .label{font:700 18px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .text{font:600 16px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111}
      .small{font:500 14px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#333}
      .box{fill:#fff;stroke:#111;stroke-width:1.8}
      .soft{fill:#f7f7f7;stroke:#111;stroke-width:1.5}
      .arrow{fill:none;stroke:#111;stroke-width:1.9;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#555;stroke-width:1.4;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" class="title">GraphRAG 檢索回應評估流程圖</text>

  <rect x="70" y="120" width="190" height="82" rx="10" class="box"/>
  <text x="165" y="150" text-anchor="middle" class="label">測試問題集</text>
  <text x="165" y="178" text-anchor="middle" class="text">責任、時程、產品</text>
  <text x="165" y="202" text-anchor="middle" class="text">語意與資料不足型</text>

  <rect x="335" y="120" width="200" height="82" rx="10" class="box"/>
  <text x="435" y="150" text-anchor="middle" class="label">系統回傳結果</text>
  <text x="435" y="178" text-anchor="middle" class="text">回答內容</text>
  <text x="435" y="202" text-anchor="middle" class="text">meeting_id / item_id</text>

  <rect x="610" y="75" width="220" height="72" rx="10" class="soft"/>
  <text x="720" y="103" text-anchor="middle" class="label">結構化欄位對照</text>
  <text x="720" y="129" text-anchor="middle" class="text">負責人、日期、追蹤結果</text>

  <rect x="610" y="175" width="220" height="72" rx="10" class="soft"/>
  <text x="720" y="203" text-anchor="middle" class="label">圖譜關係對照</text>
  <text x="720" y="229" text-anchor="middle" class="text">人員、產品、法規路徑</text>

  <rect x="610" y="275" width="220" height="72" rx="10" class="soft"/>
  <text x="720" y="303" text-anchor="middle" class="label">原始文件對照</text>
  <text x="720" y="329" text-anchor="middle" class="text">會議項目與來源位置</text>

  <rect x="910" y="160" width="210" height="92" rx="10" class="box"/>
  <text x="1015" y="190" text-anchor="middle" class="label">人工判斷</text>
  <text x="1015" y="218" text-anchor="middle" class="text">主張是否受來源支持</text>
  <text x="1015" y="242" text-anchor="middle" class="text">來源是否一致</text>

  <rect x="95" y="445" width="220" height="78" rx="10" class="box"/>
  <text x="205" y="475" text-anchor="middle" class="label">正確</text>
  <text x="205" y="503" text-anchor="middle" class="text">回答完整受來源支持</text>

  <rect x="360" y="445" width="220" height="78" rx="10" class="box"/>
  <text x="470" y="475" text-anchor="middle" class="label">部分正確</text>
  <text x="470" y="503" text-anchor="middle" class="text">相關但有遺漏或不足</text>

  <rect x="625" y="445" width="220" height="78" rx="10" class="box"/>
  <text x="735" y="475" text-anchor="middle" class="label">錯誤</text>
  <text x="735" y="503" text-anchor="middle" class="text">來源不支持或關係誤用</text>

  <rect x="890" y="445" width="220" height="78" rx="10" class="box"/>
  <text x="1000" y="475" text-anchor="middle" class="label">正確拒答</text>
  <text x="1000" y="503" text-anchor="middle" class="text">資料不足時未生成推論</text>

  <rect x="335" y="590" width="530" height="62" rx="10" class="soft"/>
  <text x="600" y="615" text-anchor="middle" class="label">錯誤分析與改進方向</text>
  <text x="600" y="642" text-anchor="middle" class="text">檢查漏召回、欄位錯置、弱關係誤用、上下文干擾與無證據生成</text>

  <path d="M260 161 H325" class="arrow"/>
  <path d="M535 161 C565 130 585 115 600 111" class="dash"/>
  <path d="M535 161 C565 185 585 205 600 211" class="dash"/>
  <path d="M535 161 C565 240 585 300 600 311" class="dash"/>
  <path d="M830 111 C865 125 890 160 900 185" class="dash"/>
  <path d="M830 211 H900" class="arrow"/>
  <path d="M830 311 C865 295 890 250 900 225" class="dash"/>
  <path d="M1015 252 C1015 345 205 390 205 435" class="dash"/>
  <path d="M1015 252 C1015 345 470 390 470 435" class="dash"/>
  <path d="M1015 252 C1015 345 735 390 735 435" class="dash"/>
  <path d="M1015 252 V435" class="dash"/>
  <path d="M205 523 C205 575 600 565 600 580" class="dash"/>
  <path d="M470 523 C470 565 600 565 600 580" class="dash"/>
  <path d="M735 523 C735 565 600 565 600 580" class="dash"/>
  <path d="M1000 523 C1000 575 600 565 600 580" class="dash"/>

  <text x="600" y="690" text-anchor="middle" class="small">資料來源：本研究整理</text>
</svg>
