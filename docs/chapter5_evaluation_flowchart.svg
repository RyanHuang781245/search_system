<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <title>第五章系統測試與案例分析流程圖</title>
  <desc>依據論文章節_補齊第五章.docx 內容整理之系統測試與案例分析流程圖。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222222"/>
    </marker>
    <style>
      .title { font: 700 25px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #111111; }
      .header { font: 700 18px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #111111; }
      .lane { font: 700 17px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #111111; writing-mode: vertical-rl; glyph-orientation-vertical: 0; }
      .box-text { font: 600 17px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #111111; }
      .small-text { font: 500 14px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #333333; }
      .frame { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
      .stage { fill: #f5f5f5; stroke: #111111; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 1.7; }
      .result { fill: #fbfbfb; stroke: #111111; stroke-width: 1.7; }
      .line { fill: none; stroke: #111111; stroke-width: 1.2; }
      .arrow { fill: none; stroke: #111111; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#ffffff"/>
  <text x="800" y="42" text-anchor="middle" class="title">第五章系統測試與案例分析流程圖</text>

  <rect x="45" y="65" width="1510" height="845" class="frame"/>
  <rect x="155" y="65" width="1400" height="46" class="stage"/>
  <line x1="45" y1="111" x2="1555" y2="111" class="line"/>
  <line x1="45" y1="270" x2="1555" y2="270" class="line"/>
  <line x1="45" y1="670" x2="1555" y2="670" class="line"/>
  <line x1="155" y1="65" x2="155" y2="910" class="line"/>
  <line x1="505" y1="65" x2="505" y2="910" class="line"/>
  <line x1="855" y1="65" x2="855" y2="910" class="line"/>
  <line x1="1205" y1="65" x2="1205" y2="910" class="line"/>

  <text x="330" y="94" text-anchor="middle" class="header">實驗準備</text>
  <text x="680" y="94" text-anchor="middle" class="header">資料建置驗證</text>
  <text x="1030" y="94" text-anchor="middle" class="header">檢索問答驗證</text>
  <text x="1380" y="94" text-anchor="middle" class="header">結果分析</text>

  <text x="95" y="170" text-anchor="middle" class="lane">研究者設定</text>
  <text x="95" y="455" text-anchor="middle" class="lane">系統測試流程</text>
  <text x="95" y="785" text-anchor="middle" class="lane">評估輸出</text>

  <!-- Researcher setup lane -->
  <rect x="215" y="145" width="230" height="70" rx="10" class="box"/>
  <text x="330" y="171" text-anchor="middle" class="box-text">
    <tspan x="330" dy="0">準備去識別化</tspan>
    <tspan x="330" dy="23">會議記錄樣本</tspan>
    <tspan x="330" dy="23">8 份 PDF</tspan>
  </text>

  <rect x="565" y="145" width="230" height="70" rx="10" class="box"/>
  <text x="680" y="171" text-anchor="middle" class="box-text">
    <tspan x="680" dy="0">設定評估指標</tspan>
    <tspan x="680" dy="23">資料完整性</tspan>
    <tspan x="680" dy="23">關係正確性</tspan>
  </text>

  <rect x="915" y="136" width="230" height="88" rx="10" class="box"/>
  <text x="1030" y="160" text-anchor="middle" class="box-text">
    <tspan x="1030" dy="0">規劃七類問題</tspan>
    <tspan x="1030" dy="23">事實、責任、時程</tspan>
    <tspan x="1030" dy="23">關聯、語意、探索</tspan>
    <tspan x="1030" dy="23">資料不足</tspan>
  </text>

  <rect x="1265" y="145" width="230" height="70" rx="10" class="box"/>
  <text x="1380" y="171" text-anchor="middle" class="box-text">
    <tspan x="1380" dy="0">人工對照來源</tspan>
    <tspan x="1380" dy="23">判定正確性</tspan>
    <tspan x="1380" dy="23">歸納限制</tspan>
  </text>

  <path d="M445 180 H555" class="arrow"/>
  <path d="M795 180 H905" class="arrow"/>
  <path d="M1145 180 H1255" class="arrow"/>

  <!-- System testing lane -->
  <rect x="215" y="315" width="230" height="76" rx="10" class="box"/>
  <text x="330" y="340" text-anchor="middle" class="box-text">
    <tspan x="330" dy="0">解析 PDF 文件</tspan>
    <tspan x="330" dy="23">建立 Document</tspan>
    <tspan x="330" dy="23">Meeting 與 MeetingItem</tspan>
  </text>

  <rect x="565" y="300" width="230" height="70" rx="10" class="box"/>
  <text x="680" y="326" text-anchor="middle" class="box-text">
    <tspan x="680" dy="0">建構知識關聯</tspan>
    <tspan x="680" dy="23">人員、日期、產品</tspan>
    <tspan x="680" dy="23">法規與關鍵詞</tspan>
  </text>

  <rect x="565" y="405" width="230" height="70" rx="10" class="box"/>
  <text x="680" y="431" text-anchor="middle" class="box-text">
    <tspan x="680" dy="0">建立語意索引</tspan>
    <tspan x="680" dy="23">以會議項目</tspan>
    <tspan x="680" dy="23">作為索引單位</tspan>
  </text>

  <rect x="915" y="300" width="230" height="70" rx="10" class="box"/>
  <text x="1030" y="326" text-anchor="middle" class="box-text">
    <tspan x="1030" dy="0">取得候選證據</tspan>
    <tspan x="1030" dy="23">欄位事實、關聯路徑</tspan>
    <tspan x="1030" dy="23">與語意相近項目</tspan>
  </text>

  <rect x="915" y="405" width="230" height="70" rx="10" class="box"/>
  <text x="1030" y="431" text-anchor="middle" class="box-text">
    <tspan x="1030" dy="0">合併證據集合</tspan>
    <tspan x="1030" dy="23">依 item_id 去重</tspan>
    <tspan x="1030" dy="23">組裝回答脈絡</tspan>
  </text>

  <rect x="915" y="510" width="230" height="70" rx="10" class="box"/>
  <text x="1030" y="536" text-anchor="middle" class="box-text">
    <tspan x="1030" dy="0">產生來源受限回答</tspan>
    <tspan x="1030" dy="23">附會議、項次</tspan>
    <tspan x="1030" dy="23">與來源欄位</tspan>
  </text>

  <rect x="1265" y="300" width="230" height="76" rx="10" class="box"/>
  <text x="1380" y="325" text-anchor="middle" class="box-text">
    <tspan x="1380" dy="0">檢查問答結果</tspan>
    <tspan x="1380" dy="23">正確、部分正確</tspan>
    <tspan x="1380" dy="23">錯誤或正確拒答</tspan>
  </text>

  <rect x="1265" y="415" width="230" height="76" rx="10" class="box"/>
  <text x="1380" y="440" text-anchor="middle" class="box-text">
    <tspan x="1380" dy="0">檢查圖譜探索</tspan>
    <tspan x="1380" dy="23">是否符合 schema</tspan>
    <tspan x="1380" dy="23">並可回溯項目</tspan>
  </text>

  <rect x="1265" y="530" width="230" height="70" rx="10" class="box"/>
  <text x="1380" y="556" text-anchor="middle" class="box-text">
    <tspan x="1380" dy="0">整理錯誤類型</tspan>
    <tspan x="1380" dy="23">分析限制</tspan>
    <tspan x="1380" dy="23">提出改善方向</tspan>
  </text>

  <path d="M330 215 V305" class="arrow"/>
  <path d="M445 353 H555" class="arrow"/>
  <path d="M680 215 V290" class="arrow"/>
  <path d="M680 370 V395" class="arrow"/>
  <path d="M795 440 H905" class="arrow"/>
  <path d="M1030 224 V290" class="arrow"/>
  <path d="M1030 370 V395" class="arrow"/>
  <path d="M1030 475 V500" class="arrow"/>
  <path d="M1145 545 H1255 V338" class="arrow"/>
  <path d="M1145 545 H1220 V453 H1255" class="arrow"/>
  <path d="M1380 376 V405" class="arrow"/>
  <path d="M1380 491 V520" class="arrow"/>

  <!-- Evaluation output lane -->
  <rect x="200" y="720" width="260" height="86" rx="10" class="result"/>
  <text x="330" y="745" text-anchor="middle" class="box-text">
    <tspan x="330" dy="0">文件解析成果</tspan>
    <tspan x="330" dy="23">Document：8/8</tspan>
    <tspan x="330" dy="23">Meeting：8/8</tspan>
    <tspan x="330" dy="23">MeetingItem：105 筆</tspan>
  </text>

  <rect x="550" y="720" width="260" height="86" rx="10" class="result"/>
  <text x="680" y="745" text-anchor="middle" class="box-text">
    <tspan x="680" dy="0">資料建置成果</tspan>
    <tspan x="680" dy="23">圖譜節點與關係可回溯</tspan>
    <tspan x="680" dy="23">向量索引：105 筆</tspan>
    <tspan x="680" dy="23">跨資料庫 item_id 一致</tspan>
  </text>

  <rect x="900" y="720" width="260" height="86" rx="10" class="result"/>
  <text x="1030" y="745" text-anchor="middle" class="box-text">
    <tspan x="1030" dy="0">問答評估成果</tspan>
    <tspan x="1030" dy="23">答案需受證據支持</tspan>
    <tspan x="1030" dy="23">來源與欄位可驗證</tspan>
    <tspan x="1030" dy="23">資料不足時拒答</tspan>
  </text>

  <rect x="1250" y="720" width="260" height="86" rx="10" class="result"/>
  <text x="1380" y="745" text-anchor="middle" class="box-text">
    <tspan x="1380" dy="0">限制與改善方向</tspan>
    <tspan x="1380" dy="23">解析、關係、召回</tspan>
    <tspan x="1380" dy="23">脈絡組裝、回答生成</tspan>
    <tspan x="1380" dy="23">與圖譜查詢限制</tspan>
  </text>

  <path d="M330 391 V710" class="arrow"/>
  <path d="M680 475 V710" class="arrow"/>
  <path d="M1030 580 V710" class="arrow"/>
  <path d="M1380 600 V710" class="arrow"/>

  <text x="800" y="860" text-anchor="middle" class="small-text">
    本圖依第五章「系統測試與案例分析」整理，呈現由實驗資料、資料建置驗證、問答案例檢查至錯誤類型歸納之流程。
  </text>
</svg>
