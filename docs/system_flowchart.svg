<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130">
  <title>結構化文件解析與 GraphRAG 檢索系統流程圖</title>
  <desc>依照泳道式流程圖格式，描述文件上傳、PDF 解析、去識別化、Mongo 儲存、Neo4j 圖譜建置、Qdrant 向量索引、一般搜尋與 GraphRAG 問答流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111111"/>
    </marker>
    <style>
      .title { font: 700 24px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #111111; }
      .header { font: 700 18px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #111111; }
      .lane { font: 700 17px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #111111; writing-mode: vertical-rl; glyph-orientation-vertical: 0; }
      .box-text { font: 600 17px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #111111; }
      .note-text { font: 500 14px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #333333; }
      .grid { fill: #ffffff; stroke: #111111; stroke-width: 1.4; }
      .stage { fill: #f7f7f7; stroke: #111111; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 1.7; }
      .store { fill: #fdfdfd; stroke: #111111; stroke-width: 1.7; }
      .decision { fill: #ffffff; stroke: #111111; stroke-width: 1.7; }
      .arrow { fill: none; stroke: #111111; stroke-width: 1.8; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #111111; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1130" fill="#ffffff"/>
  <text x="800" y="38" text-anchor="middle" class="title">結構化文件解析與 GraphRAG 檢索系統流程圖</text>

  <!-- Outer frame -->
  <rect x="40" y="60" width="1520" height="930" class="grid"/>
  <rect x="160" y="60" width="1400" height="44" class="stage"/>
  <line x1="40" y1="104" x2="1560" y2="104" class="thin"/>
  <line x1="40" y1="294" x2="1560" y2="294" class="thin"/>
  <line x1="40" y1="744" x2="1560" y2="744" class="thin"/>
  <line x1="160" y1="60" x2="160" y2="990" class="thin"/>
  <line x1="510" y1="60" x2="510" y2="990" class="thin"/>
  <line x1="860" y1="60" x2="860" y2="990" class="thin"/>
  <line x1="1210" y1="60" x2="1210" y2="990" class="thin"/>

  <!-- Column headers -->
  <text x="335" y="88" text-anchor="middle" class="header">準備階段</text>
  <text x="685" y="88" text-anchor="middle" class="header">匯入與解析階段</text>
  <text x="1035" y="88" text-anchor="middle" class="header">索引建置階段</text>
  <text x="1385" y="88" text-anchor="middle" class="header">查詢與回饋階段</text>

  <!-- Lane labels -->
  <text x="99" y="175" text-anchor="middle" class="lane">使用者操作</text>
  <text x="99" y="486" text-anchor="middle" class="lane">資料處理與索引</text>
  <text x="99" y="832" text-anchor="middle" class="lane">查詢回應</text>

  <!-- User operation lane -->
  <rect x="205" y="135" width="260" height="68" rx="12" class="box"/>
  <text x="335" y="163" text-anchor="middle" class="box-text">
    <tspan x="335" dy="0">選擇 / 上傳 PDF</tspan>
    <tspan x="335" dy="24">會議紀錄文件</tspan>
  </text>

  <rect x="555" y="135" width="260" height="68" rx="12" class="box"/>
  <text x="685" y="163" text-anchor="middle" class="box-text">
    <tspan x="685" dy="0">按下解析</tspan>
    <tspan x="685" dy="24">查看文件狀態</tspan>
  </text>

  <rect x="905" y="135" width="260" height="68" rx="12" class="box"/>
  <text x="1035" y="163" text-anchor="middle" class="box-text">
    <tspan x="1035" dy="0">管理者觸發</tspan>
    <tspan x="1035" dy="24">圖譜 / 向量重建</tspan>
  </text>

  <rect x="1255" y="128" width="260" height="82" rx="12" class="box"/>
  <text x="1385" y="154" text-anchor="middle" class="box-text">
    <tspan x="1385" dy="0">輸入關鍵字搜尋</tspan>
    <tspan x="1385" dy="24">或 GraphRAG 問題</tspan>
    <tspan x="1385" dy="24">瀏覽來源與結果</tspan>
  </text>

  <path d="M465 169 H545" class="arrow"/>
  <path d="M815 169 H895" class="arrow"/>
  <path d="M1165 169 H1245" class="arrow"/>

  <!-- Data processing lane: preparation -->
  <rect x="205" y="326" width="260" height="58" rx="12" class="box"/>
  <text x="335" y="350" text-anchor="middle" class="box-text">
    <tspan x="335" dy="0">檔案格式 / 大小驗證</tspan>
    <tspan x="335" dy="22">建立上傳請求</tspan>
  </text>

  <rect x="205" y="416" width="260" height="58" rx="12" class="box"/>
  <text x="335" y="440" text-anchor="middle" class="box-text">
    <tspan x="335" dy="0">儲存 uploads 檔案</tspan>
    <tspan x="335" dy="22">產生 document_id</tspan>
  </text>

  <rect x="205" y="506" width="260" height="72" rx="12" class="box"/>
  <text x="335" y="530" text-anchor="middle" class="box-text">
    <tspan x="335" dy="0">敏感欄位去識別化</tspan>
    <tspan x="335" dy="22">寫入 documents</tspan>
    <tspan x="335" dy="22">MongoDB</tspan>
  </text>

  <path d="M335 203 V326" class="arrow"/>
  <path d="M335 384 V416" class="arrow"/>
  <path d="M335 474 V506" class="arrow"/>

  <!-- Data processing lane: parsing -->
  <rect x="555" y="326" width="260" height="58" rx="12" class="box"/>
  <text x="685" y="350" text-anchor="middle" class="box-text">
    <tspan x="685" dy="0">PyMuPDF 擷取</tspan>
    <tspan x="685" dy="22">文字、頁面與表格</tspan>
  </text>

  <polygon points="685,412 807,464 685,516 563,464" class="decision"/>
  <text x="685" y="459" text-anchor="middle" class="box-text">
    <tspan x="685" dy="0">文字層</tspan>
    <tspan x="685" dy="22">是否足夠？</tspan>
  </text>

  <rect x="555" y="548" width="260" height="58" rx="12" class="box"/>
  <text x="685" y="572" text-anchor="middle" class="box-text">
    <tspan x="685" dy="0">解析會議 metadata</tspan>
    <tspan x="685" dy="22">與追蹤事項 items</tspan>
  </text>

  <rect x="555" y="638" width="260" height="72" rx="12" class="box"/>
  <text x="685" y="662" text-anchor="middle" class="box-text">
    <tspan x="685" dy="0">去識別化 parsed payload</tspan>
    <tspan x="685" dy="22">寫入 meeting_minutes</tspan>
    <tspan x="685" dy="22">與 meeting_items</tspan>
  </text>

  <rect x="305" y="638" width="160" height="58" rx="12" class="box"/>
  <text x="385" y="663" text-anchor="middle" class="box-text">
    <tspan x="385" dy="0">標記</tspan>
    <tspan x="385" dy="22">needs_ocr</tspan>
  </text>

  <path d="M465 445 H500 V355 H555" class="arrow"/>
  <path d="M685 203 V326" class="arrow"/>
  <path d="M685 384 V412" class="arrow"/>
  <path d="M685 516 V548" class="arrow"/>
  <path d="M685 606 V638" class="arrow"/>
  <path d="M563 464 H385 V638" class="arrow"/>
  <text x="715" y="536" class="note-text">是</text>
  <text x="495" y="454" class="note-text">否</text>

  <!-- Data processing lane: indexing -->
  <rect x="905" y="316" width="260" height="54" rx="12" class="box"/>
  <text x="1035" y="350" text-anchor="middle" class="box-text">讀取 Mongo 結構資料</text>

  <rect x="905" y="395" width="260" height="58" rx="12" class="box"/>
  <text x="1035" y="419" text-anchor="middle" class="box-text">
    <tspan x="1035" dy="0">抽取人員、單位、日期</tspan>
    <tspan x="1035" dy="22">關鍵字、產品與法規</tspan>
  </text>

  <rect x="905" y="478" width="260" height="58" rx="12" class="box"/>
  <text x="1035" y="502" text-anchor="middle" class="box-text">
    <tspan x="1035" dy="0">建立 Neo4j 節點關係</tspan>
    <tspan x="1035" dy="22">Document-Meeting-Item-Entity</tspan>
  </text>

  <rect x="905" y="561" width="260" height="58" rx="12" class="box"/>
  <text x="1035" y="585" text-anchor="middle" class="box-text">
    <tspan x="1035" dy="0">組合 embedding text</tspan>
    <tspan x="1035" dy="22">Ollama 產生向量</tspan>
  </text>

  <rect x="905" y="644" width="260" height="58" rx="12" class="box"/>
  <text x="1035" y="668" text-anchor="middle" class="box-text">
    <tspan x="1035" dy="0">寫入 / 更新 Qdrant</tspan>
    <tspan x="1035" dy="22">會議事項向量索引</tspan>
  </text>

  <path d="M815 674 H872 V343 H905" class="arrow"/>
  <path d="M1035 203 V316" class="arrow"/>
  <path d="M1035 370 V395" class="arrow"/>
  <path d="M1035 453 V478" class="arrow"/>
  <path d="M1035 536 V561" class="arrow"/>
  <path d="M1035 619 V644" class="arrow"/>

  <!-- Data processing lane: query execution -->
  <rect x="1255" y="316" width="260" height="58" rx="12" class="box"/>
  <text x="1385" y="340" text-anchor="middle" class="box-text">
    <tspan x="1385" dy="0">API 接收查詢</tspan>
    <tspan x="1385" dy="22">Search 或 GraphRAG</tspan>
  </text>

  <rect x="1255" y="399" width="260" height="72" rx="12" class="box"/>
  <text x="1385" y="423" text-anchor="middle" class="box-text">
    <tspan x="1385" dy="0">一般搜尋</tspan>
    <tspan x="1385" dy="22">Mongo 篩選 + 關鍵字</tspan>
    <tspan x="1385" dy="22">結構 / 回饋 / 圖譜加權</tspan>
  </text>

  <rect x="1255" y="496" width="260" height="72" rx="12" class="box"/>
  <text x="1385" y="520" text-anchor="middle" class="box-text">
    <tspan x="1385" dy="0">GraphRAG 路由問題</tspan>
    <tspan x="1385" dy="22">Neo4j + Qdrant 檢索</tspan>
    <tspan x="1385" dy="22">Mongo fallback 補證據</tspan>
  </text>

  <rect x="1255" y="593" width="260" height="72" rx="12" class="box"/>
  <text x="1385" y="617" text-anchor="middle" class="box-text">
    <tspan x="1385" dy="0">證據選取與 Prompt 組裝</tspan>
    <tspan x="1385" dy="22">Ollama 產生回答</tspan>
    <tspan x="1385" dy="22">比對 claim / source</tspan>
  </text>

  <path d="M1385 210 V316" class="arrow"/>
  <path d="M1385 374 V399" class="arrow"/>
  <path d="M1515 345 H1530 V532 H1515" class="arrow"/>
  <path d="M1165 507 H1224 V435 H1255" class="arrow"/>
  <path d="M1165 673 H1236 V532 H1255" class="arrow"/>
  <path d="M1385 568 V593" class="arrow"/>

  <!-- Response lane -->
  <rect x="905" y="790" width="260" height="64" rx="12" class="box"/>
  <text x="1035" y="816" text-anchor="middle" class="box-text">
    <tspan x="1035" dy="0">可視化圖譜脈絡</tspan>
    <tspan x="1035" dy="24">節點 / 關係 / 展開探索</tspan>
  </text>

  <rect x="1255" y="770" width="260" height="72" rx="12" class="box"/>
  <text x="1385" y="794" text-anchor="middle" class="box-text">
    <tspan x="1385" dy="0">回傳排序結果</tspan>
    <tspan x="1385" dy="22">關聯推薦</tspan>
    <tspan x="1385" dy="22">GraphRAG 答案與來源</tspan>
  </text>

  <rect x="1255" y="884" width="260" height="64" rx="12" class="box"/>
  <text x="1385" y="910" text-anchor="middle" class="box-text">
    <tspan x="1385" dy="0">使用者點擊結果</tspan>
    <tspan x="1385" dy="24">寫入 search / click logs</tspan>
  </text>

  <path d="M1385 665 V770" class="arrow"/>
  <path d="M1515 435 H1548 V806 H1515" class="arrow"/>
  <path d="M1255 822 H1165" class="arrow"/>
  <path d="M1385 842 V884" class="arrow"/>
  <path d="M1255 916 H1218 V435 H1255" class="arrow"/>

  <!-- Data stores / external services callouts -->
  <text x="800" y="1020" text-anchor="middle" class="header">資料庫與外部服務</text>

  <path d="M245 1050 C245 1030 425 1030 425 1050 V1090 C425 1110 245 1110 245 1090 Z" class="store"/>
  <ellipse cx="335" cy="1050" rx="90" ry="20" class="store"/>
  <text x="335" y="1072" text-anchor="middle" class="box-text">
    <tspan x="335" dy="0">MongoDB</tspan>
    <tspan x="335" dy="22">文件 / 會議 / 搜尋紀錄</tspan>
  </text>

  <path d="M595 1050 C595 1030 775 1030 775 1050 V1090 C775 1110 595 1110 595 1090 Z" class="store"/>
  <ellipse cx="685" cy="1050" rx="90" ry="20" class="store"/>
  <text x="685" y="1072" text-anchor="middle" class="box-text">
    <tspan x="685" dy="0">Neo4j</tspan>
    <tspan x="685" dy="22">知識圖譜關係</tspan>
  </text>

  <path d="M945 1050 C945 1030 1125 1030 1125 1050 V1090 C1125 1110 945 1110 945 1090 Z" class="store"/>
  <ellipse cx="1035" cy="1050" rx="90" ry="20" class="store"/>
  <text x="1035" y="1072" text-anchor="middle" class="box-text">
    <tspan x="1035" dy="0">Qdrant</tspan>
    <tspan x="1035" dy="22">向量集合</tspan>
  </text>

  <path d="M1295 1050 C1295 1030 1475 1030 1475 1050 V1090 C1475 1110 1295 1110 1295 1090 Z" class="store"/>
  <ellipse cx="1385" cy="1050" rx="90" ry="20" class="store"/>
  <text x="1385" y="1072" text-anchor="middle" class="box-text">
    <tspan x="1385" dy="0">Ollama</tspan>
    <tspan x="1385" dy="22">Embedding / LLM</tspan>
  </text>
</svg>
