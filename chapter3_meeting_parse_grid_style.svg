<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      text {
        font-family: "DFKai-SB", "BiauKai", "標楷體", "Microsoft JhengHei", serif;
        fill: #111111;
      }
      .title {
        font-size: 34px;
        font-weight: 700;
      }
      .head {
        font-size: 24px;
        font-weight: 700;
      }
      .row-label {
        font-size: 23px;
        font-weight: 700;
        writing-mode: vertical-rl;
        glyph-orientation-vertical: 0;
      }
      .box-text {
        font-size: 22px;
        font-weight: 700;
      }
      .box-small {
        font-size: 20px;
        font-weight: 700;
      }
      .note {
        font-size: 18px;
      }
      .grid {
        fill: #ffffff;
        stroke: #111111;
        stroke-width: 2;
      }
      .thin {
        stroke: #111111;
        stroke-width: 1.6;
      }
      .box {
        fill: #ffffff;
        stroke: #111111;
        stroke-width: 2.3;
        rx: 12;
      }
      .line {
        stroke: #111111;
        stroke-width: 2.2;
        fill: none;
        marker-end: url(#arrow);
      }
      .plain-line {
        stroke: #111111;
        stroke-width: 2.2;
        fill: none;
      }
      .dash {
        stroke-dasharray: 8 7;
      }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="800" y="55" text-anchor="middle" class="title">會議記錄結構化解析流程圖</text>

  <!-- Outer grid -->
  <rect x="70" y="85" width="1460" height="780" class="grid"/>

  <!-- Header and row label split -->
  <line x1="70" y1="140" x2="1530" y2="140" class="thin"/>
  <line x1="70" y1="320" x2="1530" y2="320" class="thin"/>
  <line x1="70" y1="620" x2="1530" y2="620" class="thin"/>

  <line x1="125" y1="85" x2="125" y2="865" class="thin"/>
  <line x1="475" y1="85" x2="475" y2="865" class="thin"/>
  <line x1="825" y1="85" x2="825" y2="865" class="thin"/>
  <line x1="1175" y1="85" x2="1175" y2="865" class="thin"/>

  <!-- Column headers -->
  <text x="300" y="123" text-anchor="middle" class="head">資料輸入</text>
  <text x="650" y="123" text-anchor="middle" class="head">主檔解析</text>
  <text x="1000" y="123" text-anchor="middle" class="head">項目解析</text>
  <text x="1350" y="123" text-anchor="middle" class="head">結構化輸出</text>

  <!-- Row labels -->
  <text x="102" y="205" text-anchor="middle" dominant-baseline="middle" class="row-label">輸入判斷</text>
  <text x="102" y="470" text-anchor="middle" dominant-baseline="middle" class="row-label">系統處理</text>
  <text x="102" y="742" text-anchor="middle" dominant-baseline="middle" class="row-label">輸出資料</text>

  <!-- Column 1 boxes -->
  <rect x="165" y="178" width="270" height="78" class="box"/>
  <text x="300" y="207" text-anchor="middle" class="box-text">匯入固定格式</text>
  <text x="300" y="236" text-anchor="middle" class="box-text">企業會議記錄 PDF</text>

  <rect x="165" y="425" width="270" height="78" class="box"/>
  <text x="300" y="454" text-anchor="middle" class="box-text">讀取每頁文字</text>
  <text x="300" y="483" text-anchor="middle" class="box-text">表格內容與座標</text>

  <rect x="165" y="715" width="270" height="78" class="box"/>
  <text x="300" y="744" text-anchor="middle" class="box-text">不符合條件</text>
  <text x="300" y="773" text-anchor="middle" class="box-text">標記 needs_ocr</text>

  <!-- Column 2 boxes -->
  <rect x="515" y="178" width="270" height="78" class="box"/>
  <text x="650" y="207" text-anchor="middle" class="box-text">判斷文字層</text>
  <text x="650" y="236" text-anchor="middle" class="box-text">與必要標記</text>

  <rect x="515" y="360" width="270" height="92" class="box"/>
  <text x="650" y="389" text-anchor="middle" class="box-small">抽取會議主檔</text>
  <text x="650" y="418" text-anchor="middle" class="box-small">名稱、日期、地點</text>
  <text x="650" y="447" text-anchor="middle" class="box-small">主席與出席人員</text>

  <rect x="515" y="525" width="270" height="82" class="box"/>
  <text x="650" y="555" text-anchor="middle" class="box-text">建立 Document</text>
  <text x="650" y="584" text-anchor="middle" class="box-text">與 Meeting 資料</text>

  <rect x="515" y="715" width="270" height="78" class="box"/>
  <text x="650" y="744" text-anchor="middle" class="box-small">產生 document_id</text>
  <text x="650" y="773" text-anchor="middle" class="box-small">與 meeting_id</text>

  <!-- Column 3 boxes -->
  <rect x="865" y="178" width="270" height="78" class="box"/>
  <text x="1000" y="207" text-anchor="middle" class="box-text">偵測項次欄位</text>
  <text x="1000" y="236" text-anchor="middle" class="box-text">定位列邊界</text>

  <rect x="865" y="350" width="270" height="82" class="box"/>
  <text x="1000" y="380" text-anchor="middle" class="box-text">切分會議項目</text>
  <text x="1000" y="409" text-anchor="middle" class="box-text">一列一筆 item</text>

  <rect x="865" y="510" width="270" height="92" class="box"/>
  <text x="1000" y="539" text-anchor="middle" class="box-small">合併跨行內容</text>
  <text x="1000" y="568" text-anchor="middle" class="box-small">依欄位位置抽取</text>
  <text x="1000" y="597" text-anchor="middle" class="box-small">內容、負責人與日期</text>

  <rect x="865" y="715" width="270" height="78" class="box"/>
  <text x="1000" y="744" text-anchor="middle" class="box-text">產生 MeetingItem</text>
  <text x="1000" y="773" text-anchor="middle" class="box-text">item_id</text>

  <!-- Column 4 boxes -->
  <rect x="1215" y="220" width="270" height="78" class="box"/>
  <text x="1350" y="249" text-anchor="middle" class="box-text">正規化欄位</text>
  <text x="1350" y="278" text-anchor="middle" class="box-text">日期、負責人、缺漏值</text>

  <rect x="1215" y="430" width="270" height="88" class="box"/>
  <text x="1350" y="459" text-anchor="middle" class="box-text">組成結構化資料</text>
  <text x="1350" y="488" text-anchor="middle" class="box-text">保留來源識別碼</text>

  <rect x="1215" y="715" width="270" height="78" class="box"/>
  <text x="1350" y="744" text-anchor="middle" class="box-text">輸出 JSON</text>
  <text x="1350" y="773" text-anchor="middle" class="box-small">Document / Meeting / MeetingItem</text>

  <!-- Flow arrows -->
  <path d="M435 217 L515 217" class="line"/>
  <path d="M300 256 L300 425" class="line"/>
  <path d="M435 464 L515 406" class="line"/>
  <path d="M650 256 L650 360" class="line"/>
  <path d="M650 452 L650 525" class="line"/>
  <path d="M650 607 L650 715" class="line"/>

  <path d="M785 566 L865 217" class="line"/>
  <path d="M1000 256 L1000 350" class="line"/>
  <path d="M1000 432 L1000 510" class="line"/>
  <path d="M1000 602 L1000 715" class="line"/>

  <path d="M1135 556 L1215 259" class="line"/>
  <path d="M1350 298 L1350 430" class="line"/>
  <path d="M1350 518 L1350 715" class="line"/>

  <!-- OCR branch -->
  <path d="M650 256 C650 690 440 754 435 754" class="line dash"/>
  <text x="532" y="690" class="note">否</text>
  <text x="704" y="286" class="note">是</text>

  <!-- Bottom note -->
  <text x="800" y="910" text-anchor="middle" class="note">資料來源：本研究整理</text>
</svg>
