<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      text {
        font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
        fill: #111827;
      }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4b5563; }
      .participant { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; }
      .small { font-size: 12px; fill: #374151; }
      .note-title { font-size: 14px; font-weight: 700; fill: #374151; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 8; }
      .lifeline { stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 7 7; }
      .activation { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1; rx: 3; }
      .arrow { stroke: #1f2937; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .return { stroke: #4b5563; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); fill: none; }
      .block { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.4; rx: 10; }
      .block-label { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.4; rx: 6; }
      .label-bg { fill: #ffffff; opacity: 0.92; rx: 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#ffffff"/>

  <text x="700" y="46" text-anchor="middle" class="title">GraphRAG 問答流程循序圖</text>
  <text x="700" y="74" text-anchor="middle" class="subtitle">
    使用者提問後，系統依查詢意圖整合圖譜、向量與結構化資料，再由語言模型產生具來源依據的回答
  </text>

  <!-- Participants -->
  <g id="participants">
    <rect class="box" x="45" y="105" width="120" height="54"/>
    <text class="participant" x="105" y="139" text-anchor="middle">使用者</text>

    <rect class="box" x="205" y="105" width="130" height="54"/>
    <text class="participant" x="270" y="139" text-anchor="middle">前端介面</text>

    <rect class="box" x="380" y="105" width="130" height="54"/>
    <text class="participant" x="445" y="139" text-anchor="middle">Django 後端</text>

    <rect class="box" x="560" y="105" width="120" height="54"/>
    <text class="participant" x="620" y="130" text-anchor="middle">查詢路由</text>
    <text class="small" x="620" y="149" text-anchor="middle">Router</text>

    <rect class="box" x="725" y="105" width="110" height="54"/>
    <text class="participant" x="780" y="139" text-anchor="middle">Neo4j</text>

    <rect class="box" x="875" y="105" width="110" height="54"/>
    <text class="participant" x="930" y="139" text-anchor="middle">Qdrant</text>

    <rect class="box" x="1025" y="105" width="125" height="54"/>
    <text class="participant" x="1087.5" y="139" text-anchor="middle">MongoDB</text>

    <rect class="box" x="1190" y="105" width="120" height="54"/>
    <text class="participant" x="1250" y="130" text-anchor="middle">Ollama</text>
    <text class="small" x="1250" y="149" text-anchor="middle">LLM</text>
  </g>

  <!-- Lifelines -->
  <line class="lifeline" x1="105" y1="160" x2="105" y2="910"/>
  <line class="lifeline" x1="270" y1="160" x2="270" y2="910"/>
  <line class="lifeline" x1="445" y1="160" x2="445" y2="910"/>
  <line class="lifeline" x1="620" y1="160" x2="620" y2="910"/>
  <line class="lifeline" x1="780" y1="160" x2="780" y2="910"/>
  <line class="lifeline" x1="930" y1="160" x2="930" y2="910"/>
  <line class="lifeline" x1="1087.5" y1="160" x2="1087.5" y2="910"/>
  <line class="lifeline" x1="1250" y1="160" x2="1250" y2="910"/>

  <!-- Activation bars -->
  <rect class="activation" x="263" y="218" width="14" height="690"/>
  <rect class="activation" x="438" y="250" width="14" height="640"/>
  <rect class="activation" x="613" y="292" width="14" height="72"/>
  <rect class="activation" x="773" y="410" width="14" height="58"/>
  <rect class="activation" x="923" y="540" width="14" height="58"/>
  <rect class="activation" x="1080.5" y="675" width="14" height="58"/>
  <rect class="activation" x="1243" y="795" width="14" height="58"/>

  <!-- Main request -->
  <line class="arrow" x1="105" y1="220" x2="270" y2="220"/>
  <rect class="label-bg" x="125" y="194" width="125" height="20"/>
  <text class="label" x="187.5" y="209" text-anchor="middle">輸入問題</text>

  <line class="arrow" x1="270" y1="255" x2="445" y2="255"/>
  <rect class="label-bg" x="294" y="229" width="128" height="20"/>
  <text class="label" x="357.5" y="244" text-anchor="middle">送出問答請求</text>

  <line class="arrow" x1="445" y1="300" x2="620" y2="300"/>
  <rect class="label-bg" x="471" y="270" width="124" height="38"/>
  <text class="label" x="532.5" y="285" text-anchor="middle">問題理解</text>
  <text class="label" x="532.5" y="303" text-anchor="middle">與查詢路由</text>

  <line class="return" x1="620" y1="350" x2="445" y2="350"/>
  <rect class="label-bg" x="480" y="324" width="105" height="20"/>
  <text class="label" x="532.5" y="339" text-anchor="middle">回傳查詢策略</text>

  <!-- Neo4j optional block -->
  <rect class="block" x="360" y="385" width="545" height="110"/>
  <rect class="block-label" x="378" y="400" width="128" height="28"/>
  <text class="note-title" x="442" y="419" text-anchor="middle">需要圖譜關係</text>

  <line class="arrow" x1="445" y1="435" x2="780" y2="435"/>
  <rect class="label-bg" x="540" y="407" width="145" height="38"/>
  <text class="label" x="612.5" y="422" text-anchor="middle">查詢知識圖譜</text>
  <text class="label" x="612.5" y="440" text-anchor="middle">與關係路徑</text>

  <line class="return" x1="780" y1="470" x2="445" y2="470"/>
  <rect class="label-bg" x="520" y="444" width="185" height="20"/>
  <text class="label" x="612.5" y="459" text-anchor="middle">回傳關係與候選 item_id</text>

  <!-- Qdrant optional block -->
  <rect class="block" x="360" y="515" width="695" height="110"/>
  <rect class="block-label" x="378" y="530" width="142" height="28"/>
  <text class="note-title" x="449" y="549" text-anchor="middle">需要語意召回</text>

  <line class="arrow" x1="445" y1="565" x2="930" y2="565"/>
  <rect class="label-bg" x="627" y="537" width="120" height="38"/>
  <text class="label" x="687.5" y="552" text-anchor="middle">向量語意查詢</text>
  <text class="label" x="687.5" y="570" text-anchor="middle">MeetingItem</text>

  <line class="return" x1="930" y1="600" x2="445" y2="600"/>
  <rect class="label-bg" x="590" y="574" width="195" height="20"/>
  <text class="label" x="687.5" y="589" text-anchor="middle">回傳相似 item_id 與分數</text>

  <!-- MongoDB lookup -->
  <line class="arrow" x1="445" y1="690" x2="1087.5" y2="690"/>
  <rect class="label-bg" x="675" y="662" width="182" height="38"/>
  <text class="label" x="766" y="677" text-anchor="middle">依 meeting_id / item_id</text>
  <text class="label" x="766" y="695" text-anchor="middle">回查結構化欄位</text>

  <line class="return" x1="1087.5" y1="730" x2="445" y2="730"/>
  <rect class="label-bg" x="670" y="704" width="192" height="20"/>
  <text class="label" x="766" y="719" text-anchor="middle">回傳完整會議與項目資料</text>

  <!-- Evidence composition -->
  <path class="arrow" d="M 445 760 C 535 760, 535 790, 445 790"/>
  <rect class="label-bg" x="555" y="746" width="240" height="48"/>
  <text class="label" x="570" y="762" text-anchor="start">整理證據集合</text>
  <text class="small" x="570" y="781" text-anchor="start">保留 meeting_id、item_id、欄位內容</text>

  <!-- LLM generation -->
  <rect class="block" x="360" y="815" width="950" height="95"/>
  <rect class="block-label" x="378" y="830" width="116" height="28"/>
  <text class="note-title" x="436" y="849" text-anchor="middle">回答生成</text>

  <line class="arrow" x1="445" y1="850" x2="1250" y2="850"/>
  <rect class="label-bg" x="752" y="822" width="190" height="38"/>
  <text class="label" x="847.5" y="837" text-anchor="middle">傳入來源證據</text>
  <text class="label" x="847.5" y="855" text-anchor="middle">限制模型依據證據回答</text>

  <line class="return" x1="1250" y1="885" x2="445" y2="885"/>
  <rect class="label-bg" x="758" y="859" width="180" height="20"/>
  <text class="label" x="847.5" y="874" text-anchor="middle">回傳答案草稿</text>

  <!-- Response -->
  <line class="return" x1="445" y1="925" x2="270" y2="925"/>
  <rect class="label-bg" x="292" y="899" width="132" height="20"/>
  <text class="label" x="357.5" y="914" text-anchor="middle">答案與來源依據</text>

  <line class="return" x1="270" y1="955" x2="105" y2="955"/>
  <rect class="label-bg" x="128" y="929" width="120" height="20"/>
  <text class="label" x="187.5" y="944" text-anchor="middle">顯示查詢結果</text>
</svg>
